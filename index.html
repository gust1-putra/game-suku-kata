// --- FUNGSI SUARA ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
  if (!audioCtx) { audioCtx = new AudioContext(); }
}

function playSound(type) {
  initAudio();
  if (audioCtx.state === 'suspended') { audioCtx.resume(); }
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  
  if (type === 'click') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'correct') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  } else if (type === 'win') {
    const notes = [400, 500, 600, 800];
    notes.forEach((freq, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
      g.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.3);
      o.start(audioCtx.currentTime + i * 0.1); o.stop(audioCtx.currentTime + i * 0.1 + 0.3);
    });
  }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  questions = shuffle(allQuestions).slice(0, 20);
  current = 0; score = 0;
  document.getElementById('qTotal').textContent = questions.length;
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('endScreen').style.display = 'none';
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('qNum').textContent = current + 1;
  document.getElementById('score').textContent = score;
  document.getElementById('topic').textContent = q.topic;
  document.getElementById('emoji').textContent = q.emoji;
  document.getElementById('question').textContent = q.question;
  document.getElementById('blank').textContent = "__";
  document.getElementById('rest').textContent = q.rest;
  document.getElementById('progress').style.width = (current / questions.length * 100) + '%';

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const opts = shuffle(q.opts);
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => { playSound('click'); checkAnswer(btn, opt, q); };
    optsDiv.appendChild(btn);
  });

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
}

function checkAnswer(btn, chosen, q) {
  const allOpts = document.querySelectorAll('.option');
  allOpts.forEach(b => b.disabled = true);
  const feedback = document.getElementById('feedback');

  if (chosen === q.ans) {
    btn.classList.add('correct');
    feedback.textContent = '✅ Benar! Hebat!';
    feedback.className = 'feedback correct';
    score += 10;
    document.getElementById('score').textContent = score;
    playSound('correct');
  } else {
    btn.classList.add('wrong');
    allOpts.forEach(b => { if (b.textContent === q.ans) b.classList.add('correct'); });
    feedback.textContent = `❌ Belum tepat. Jawabannya: "${q.ans}"`;
    feedback.className = 'feedback wrong';
    playSound('wrong');
  }
  document.getElementById('nextBtn').style.display = 'inline-block';
}

document.getElementById('nextBtn').onclick = () => {
  playSound('click');
  current++;
  if (current >= questions.length) showEnd();
  else renderQuestion();
};

function showEnd() {
  playSound('win');
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'block';
  document.getElementById('finalScore').textContent = score;
  const pct = score / (questions.length * 10);
  document.getElementById('stars').textContent = pct >= 0.9 ? '⭐⭐⭐' : pct >= 0.7 ? '⭐⭐' : '⭐';
}

function restartGame() { playSound('click'); startGame(); }

startGame();
</script>
